#################################
#       Configuración General   #
#################################
backend = "glx"
vsync = true
use-damage = true

#################################
#         Transparencia         #
#################################
inactive-opacity = 1.0
active-opacity = 1.0

# ¡¡¡CORRECCIÓN IMPORTANTE!!! 
# Picom usa DOS PUNTOS (:) como separador entre valor y regla
# Formato correcto: "valor:condición"

opacity-rule = [
    "100:class_g = 'MacWidgets'",
    # CORRECTO: "90:class_g = 'Alacritty'"
    # INCORRECTO: "0.90:class_g = 'Alacritty'"
    
    # Alacritty no tiene opacidad propia: Picom controla su transparencia.
    "56:class_g = 'Alacritty'",
    
    # Otras apps
    # Kitty ya usa su propia transparencia Liquid Glass.
    "100:class_g = 'kitty'",
    
    # Apps que deben ser opacas
    "100:class_g = 'firefox'",
    "100:class_g = 'chromium'",
    "100:class_g = 'discord'",
    "100:class_g = 'Spotify'",
    "100:class_g = 'vlc'",           # ¡CORREGIDO! Era "1.0:class_g = 'vlc'"
    "100:class_g = 'mpv'"
];

#################################
#           Excluir             #
#################################
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.20;
shadow-offset-x = -7;
shadow-offset-y = -7;

shadow-exclude = [
    "window_type = 'desktop'",
    "window_type = 'dock'",
    "name = 'Notification'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#           Blur (opcional)     #
#################################
blur-background = true;
blur-background-frame = false;
blur-method = "dual_kawase";
blur-strength = 7;

blur-background-exclude = [
    "class_g != 'MacWidgets' && class_g != 'kitty' && class_g != 'Alacritty'",
    "class_g = 'slop'",
    "name = 'Notification'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

corner-radius = 14;
corner-radius-rules = [
    "0:window_type = 'dock'",
    "0:_NET_WM_STATE@:32a *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
# Animaciones estilo macOS
#################################

animations = (
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.24;
    scale = 0.94;
  },
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.20;
    scale = 0.94;
  },
  {
    triggers = [ "geometry" ];
    preset = "geometry-change";
    duration = 0.18;
  }
);
